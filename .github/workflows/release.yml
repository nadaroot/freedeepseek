name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FreeDeepseekAPI ${{ github.ref_name }}
          body: |
            ## What's New in FreeDeepseekAPI ${{ github.ref_name }}

            ### Highlights
            - **Native Vision & Multimodal Support**: Full image recognition via DeepSeek Web API with automatic base64 conversion and `ref_file_ids` upload.
            - **OpenAI Tools & Function Calling**: Full compatibility with LangChain, AutoGen, CrewAI and OpenAI SDK.
            - **Web Search & Reasoning Controls**: Direct toggle for web search (`search_enabled`) and thinking mode via request parameters and headers.
            - **Docker & Compose**: Production-ready containerization with 1-click launch.
            - **Ready-to-use Integrations**: Pre-made configuration files for LibreChat, Open-WebUI, Cursor, Continue.dev, NextChat, and Cline.
            - **Zero Runtime Dependencies**: Lightweight and fast, runs natively on Node.js 18+.
          draft: false
          prerelease: false
          generate_release_notes: true
